name: Quality and container release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore and test .NET
        run: |
          dotnet restore MonoReport.slnx
          dotnet build MonoReport.slnx -c Release --no-restore
          dotnet test MonoReport.slnx -c Release --no-build --no-restore
      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Verify production publish
        run: dotnet publish MonoReport.Api/MonoReport.Api.csproj -c Release --no-restore -o '${{ runner.temp }}/monoreport-publish'

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: monoreport:ci
          build-args: APP_VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test runtime image
        run: bash scripts/container-smoke.sh monoreport:ci 8080

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [quality, container]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: release
        name: Validate release tag
        run: node .github/scripts/release-version.mjs '${{ github.ref_name }}'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/montr/monoreport
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.source=https://github.com/montr/monoreport
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Build and publish release manifest
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: '${{ steps.metadata.outputs.tags }}'
          labels: '${{ steps.metadata.outputs.labels }}'
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            SOURCE_URL=https://github.com/montr/monoreport
          cache-from: type=gha
      - name: Verify published architecture
        env:
          IMAGE: ghcr.io/montr/monoreport:${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE" > manifest.txt
          grep -q 'linux/amd64' manifest.txt

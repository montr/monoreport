services:
  monoreport:
    image: "${MONOREPORT_IMAGE:-ghcr.io/montr/monoreport}:${MONOREPORT_TAG:-latest}"
    ports:
      - "${MONOREPORT_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

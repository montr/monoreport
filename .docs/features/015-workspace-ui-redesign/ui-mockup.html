<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonoReport — UI mockup v4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#262626;background:#fafafa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,select,input,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid #d9d9d9;background:#fff;border-radius:6px;padding:6px 12px;color:#262626}button:hover{border-color:#999;color:#262626}button.primary{background:#333;color:white;border-color:#333}button.primary:hover{background:#555}button.ghost{border:none;background:transparent}button.icon{padding:6px 9px}button:disabled{opacity:.45;cursor:default}select{border:1px solid #d9d9d9;border-radius:6px;padding:6px 9px;max-width:220px;min-width:130px;background:white}.app{display:flex;flex-direction:column;height:100dvh;min-height:520px;background:#fff}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:14px;border-bottom:1px solid #f0f0f0;min-height:63px}.brand{font-size:18px;font-weight:700;letter-spacing:-.4px}.brand .mono{color:inherit}.actions,.group,.panel-head,.statusbar,.bottom-head{display:flex;align-items:center;gap:8px}.actions{justify-content:flex-end;flex-wrap:wrap}.splitbutton{display:flex;gap:0}.splitbutton button:first-child{border-radius:6px 0 0 6px}.splitbutton button:last-child{border-radius:0 6px 6px 0;border-left:0}.workspace{display:flex;flex:1;min-height:120px;overflow:hidden}.pane{display:flex;flex-direction:column;min-width:0}.data-pane{flex:1}.document-pane{flex:1;background:#f8f8f8}.resize{width:2px;cursor:col-resize;background:#e5e5e5;flex-shrink:0}.resize:hover{background:#b0b0b0}.panel-head{background:white;justify-content:space-between;min-height:52px;padding:8px 16px;border-bottom:1px solid #f0f0f0;gap:12px}.panel-head strong{font-size:14px}.panel-head .group{min-width:0}.panel-head select{max-width:190px}.editor{display:flex;flex:1;min-height:0;padding:14px 16px 6px}textarea{border:0;outline:0;width:100%;height:100%;resize:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.65;color:#282828;background:transparent}.editor-empty{margin:auto;text-align:center;color:#777;padding:20px}.editor-footer{border-top:1px solid #f5f5f5;padding:8px 16px;color:#888;font-size:12px;display:flex;justify-content:space-between}.document-content{overflow:auto;min-height:0;flex:1;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px}.page{width:min(100%,530px);min-height:450px;background:#fff;box-shadow:0 2px 14px #00000014;padding:42px 45px;line-height:1.8}.page h2{margin:0 0 18px;font-size:21px}.page hr{border:0;border-top:1px solid #eee}.muted{color:#8c8c8c}.tiny{font-size:12px}.secondary{font-size:12px;color:#888}.view-toggle{display:flex;border:1px solid #d9d9d9;border-radius:6px;overflow:hidden;flex-shrink:0}.view-toggle button{border:0;border-radius:0}.view-toggle button.active{background:#f5f5f5;font-weight:600}.diagnostics{height:220px;min-height:130px;border-top:1px solid #ddd;display:flex;flex-direction:column;background:#fff}.bottom-head{justify-content:space-between;border-bottom:1px solid #eee;padding:8px 16px}.tabs{display:flex;gap:2px}.tabs button{border:0;border-radius:0}.tabs button.active{border-bottom:2px solid #777;font-weight:600}.bottom-body{overflow:auto;padding:12px 20px;flex:1;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}.output-actions{display:flex;justify-content:flex-end;margin-bottom:6px}.log-row{display:flex;gap:16px;align-items:center;padding:5px 0}.log-time{color:#999}.ok{color:#39855e}.bad{color:#555}.statusbar{justify-content:space-between;border-top:1px solid #eee;min-height:35px;padding:4px 16px;color:#777;font-size:12px}.statusbar button{font-size:12px;color:#666}.status-link{font-size:12px;color:#666;text-decoration:none}.status-link:hover{text-decoration:underline}.statusbar .good{color:#39855e}.statusbar .warn{color:#b87a21}.statusbar .error{color:#555}.dropdown{position:absolute;z-index:40;background:#fff;box-shadow:0 5px 20px #0002;border:1px solid #eee;border-radius:8px;padding:5px;min-width:180px;max-height:60vh;overflow:auto}.dropdown[hidden],[hidden]{display:none!important}.dropdown button{display:flex;width:100%;border:0;text-align:left;justify-content:space-between;padding:8px 12px;gap:24px}.dropdown .heading{font-size:11px;color:#999;padding:10px 10px 4px}.dropdown kbd{font-size:11px;color:#aaa}.dropdown .danger{color:#333}.modal-shade{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}.modal{background:white;border-radius:10px;padding:24px;width:min(100%,430px);box-shadow:0 12px 40px #0002}.modal h2{font-size:19px;margin:0 0 12px}.modal label{display:block;margin:15px 0 6px}.modal input[type=number]{border:1px solid #ddd;border-radius:6px;padding:8px;width:120px}.modal .footer{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.callout{padding:8px 14px;background:#fffbe6;border:1px solid #ffe58f;font-size:12px}.empty{margin:auto;text-align:center;color:#777;max-width:300px}.empty button{margin-top:12px}.hidden-doc .data-pane{flex:1!important}.hidden-doc .resize,.hidden-doc .document-pane{display:none}.badge{display:inline-block;border:1px solid #ddd;border-radius:10px;padding:1px 7px;color:#888;font-size:11px}@media(max-width:720px){.topbar{align-items:flex-start}.actions{gap:4px}.workspace{flex-direction:column}.resize{height:2px;width:100%;cursor:row-resize}.data-pane,.document-pane{flex:1!important;min-height:180px}.panel-head{padding:8px}.page{min-height:250px;padding:24px}.document-content{padding:12px}.brand{font-size:15px}}
</style></head><body>
<!-- Layout-only mockup. Implement with Ant Design controls, not the bespoke HTML/CSS below. -->
<div class="app" id="app"><header class="topbar"><div class="brand"><span class="mono">mono</span>report</div><div class="actions"><button data-menu="examples">▤ Examples ▾</button><div class="splitbutton"><button id="analyze">⌕ Analyze</button><button data-menu="analyze" aria-label="Analyze options">▾</button></div><button class="primary" id="generate">▶ Generate</button><button class="ghost icon" data-menu="main" aria-label="More application commands">···</button></div></header>
<main class="workspace" id="workspace"><section class="pane data-pane" id="dataPane"><div class="panel-head"><strong>Data</strong><div class="group"><select id="jsonSelect" title="Open JSON files"></select><button class="ghost icon" data-menu="data" title="Data actions">···</button></div></div><div class="editor" id="editorWrap"><textarea id="jsonEditor" spellcheck="false" aria-label="JSON editor"></textarea></div><div class="editor-empty" id="editorEmpty" hidden><p>No JSON file open</p><button id="reopenJson">Open JSON…</button></div><div class="editor-footer"><span>JSON · UTF-8</span><span id="dataStatus">Saved</span></div></section><div class="resize" id="resizer" title="Drag to resize"></div><section class="pane document-pane" id="documentPane"><div class="panel-head"><div class="group"><div class="view-toggle"><button id="viewTemplate">Template</button><button id="viewResult" class="active">Result</button></div></div><div class="group"><select id="templateSelect" title="Open templates"></select><button class="ghost icon" data-menu="template" title="Template actions">···</button></div></div><div class="document-content" id="documentContent"></div></section></main>
<section class="diagnostics" id="diagnostics" hidden><div class="bottom-head"><div class="tabs"><button data-tab="problems">Problems <span id="problemCount"></span></button><button data-tab="analysis">Analysis</button><button data-tab="output" class="active">Output</button></div><div class="group"><button class="ghost" id="hideDiagnostics">⌄</button></div></div><div class="bottom-body"><div class="output-actions" id="outputActions"><button class="ghost" id="clearOutput">Clear</button></div><div id="bottomBody"></div></div></section>
<footer class="statusbar"><span id="generationStatus">✓ Ready</span><div class="group"><a href="https://github.com/montr/mr" target="_blank" rel="noopener noreferrer" class="status-link" title="GitHub repository">GitHub ↗</a><button class="ghost" id="showDocument" hidden>Show document</button><button class="ghost" data-open-tab="problems">Problems</button><button class="ghost" data-open-tab="analysis">Analysis</button><button class="ghost" data-open-tab="output">Output ⌃</button></div></footer></div>
<div class="dropdown" id="dropdown" hidden></div><div class="modal-shade" id="modalShade" hidden><div class="modal" id="modal"></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let files=[{name:'invoice.json',value:JSON.stringify({company:'Acme Inc.',customer:'Northwind',total:12500,items:[{name:'Service',price:12500}]},null,2),dirty:false},{name:'test-data.json',value:JSON.stringify({company:'Contoso',customer:'Example Ltd.',total:250,items:[]},null,2),dirty:false}];let active='invoice.json',templates=['invoice.docx','report.xlsx'],template='invoice.docx',view='result',status='ready',result={company:'Acme Inc.',customer:'Northwind',total:12500},problem='',analysis=false,tab='output',logs=[{time:'14:32:16',type:'Generate',ms:'324 ms',ok:true},{time:'14:31:04',type:'Analyze',ms:'87 ms',ok:true}],wrap=true;
const current=()=>files.find(f=>f.name===active);const log=(type,ok=true,ms='—')=>{logs.unshift({time:new Date().toLocaleTimeString('en-GB'),type,ms,ok});renderBottom()};
function renderFiles(){const s=$('#jsonSelect');s.innerHTML=(files.length?'':'<option value="">No open files</option>')+files.map(f=>`<option value="${esc(f.name)}">${f.dirty?'● ':''}${esc(f.name)}</option>`).join('');s.value=active;$('#jsonEditor').value=current()?.value||'';$('#editorWrap').hidden=!current();$('#editorEmpty').hidden=!!current();$('#dataStatus').textContent=current()?.dirty?'● Unsaved changes':'Saved';$('#jsonEditor').style.whiteSpace=wrap?'pre-wrap':'pre'}
function renderTemplates(){const s=$('#templateSelect');s.innerHTML='<option value="">No template</option>'+templates.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');s.value=template;renderDocument()}
function renderDocument(){$('#viewTemplate').classList.toggle('active',view==='template');$('#viewResult').classList.toggle('active',view==='result');const el=$('#documentContent');if(!template){el.innerHTML='<div class="empty"><h3>Upload template</h3><p>Drop a DOCX or XLSX file here</p><button id="emptyUpload">Upload template</button></div>';$('#emptyUpload').onclick=uploadTemplate;return}const isXlsx=template.endsWith('.xlsx');const content=isXlsx?`<h2>${view==='template'?'Spreadsheet template':'Spreadsheet result'}</h2><table cellspacing="0" cellpadding="10" border="1" style="border-color:#eee;border-collapse:collapse;width:100%"><tr><th>Item</th><th>Count</th><th>Amount</th></tr><tr><td>Product</td><td>2</td><td>250</td></tr></table>`:`<h2>${view==='template'?'Invoice Template':'Invoice'}</h2><p>Company: ${view==='template'?'&#123;&#123;company&#125;&#125;':esc(result.company)}</p><p>Customer: ${view==='template'?'&#123;&#123;customer&#125;&#125;':esc(result.customer)}</p><hr><p><b>Total:</b> ${view==='template'?'&#123;&#123;total&#125;&#125;':esc(result.total)}</p>`;el.innerHTML=`<div class="page">${content}</div>${view==='result'&&status==='outdated'?'<span class="secondary">Previous result · Generate to update</span>':''}<span class="secondary">Viewer zoom and page controls belong to the real viewer.</span>`}
function renderStatus(){const messages={ready:'✓ Ready',outdated:'◉ Result outdated',generating:'◌ Generating…',error:'✕ Generation failed',empty:'Not generated'};$('#generationStatus').textContent=messages[status]||status;$('#generationStatus').className=status==='ready'?'good':status==='error'?'error':'warn'}
function renderBottom(){const el=$('#bottomBody');$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#outputActions').hidden=tab!=='output';$('#problemCount').textContent=problem?'(1)':'';if(tab==='output')el.innerHTML=logs.length?logs.map(l=>`<div class="log-row"><span class="log-time">${esc(l.time)}</span><span class="${l.ok?'ok':'bad'}">${l.ok?'✓':'✕'}</span><strong>${esc(l.type)}</strong><span class="muted">${l.ok?'Completed':'Failed'}</span><span style="margin-left:auto">${esc(l.ms)}</span></div>`).join(''):'<p class="muted">No output in this session.</p>';else if(tab==='problems')el.innerHTML=problem?`<span class="bad">✕ ${esc(problem)}</span>`:'<span class="ok">✓ No problems reported.</span>';else el.innerHTML=analysis?'<div>Template fields</div><p>company <span class="muted">string</span></p><p>customer <span class="muted">string</span></p><p>items <span class="muted">collection</span></p>':'<p class="muted">Run Analyze to inspect template fields.</p>'}
function openTab(t){tab=t;$('#diagnostics').hidden=false;renderBottom()};function generate(){if(!template||!current())return;status='generating';renderStatus();try{const v=JSON.parse(current().value);result={company:v.company??'—',customer:v.customer??'—',total:v.total??0};problem='';status='ready';view='result';log('Generate',true,'~320 ms')}catch(e){problem='Invalid JSON: '+e.message;status='error';log('Generate',false,'~20 ms');openTab('problems')}renderStatus();renderDocument()};function analyze(){if(!template)return;analysis=true;log('Analyze',true,'~85 ms');openTab('analysis')}
function menu(items,anchor){const d=$('#dropdown');d.innerHTML=items.map((it,i)=>it.heading?`<div class="heading">${esc(it.heading)}</div>`:`<button data-index="${i}" class="${it.danger?'danger':''}"><span>${esc(it.label)}</span><kbd>${esc(it.key||'')}</kbd></button>`).join('');d.hidden=false;const r=anchor.getBoundingClientRect();d.style.top=Math.min(r.bottom+5,innerHeight-200)+'px';d.style.left=Math.max(8,Math.min(r.right-225,innerWidth-245))+'px';d.onclick=e=>{const b=e.target.closest('button[data-index]');if(!b)return;d.hidden=true;items[Number(b.dataset.index)].action?.()}}
const closeMenu=()=>$('#dropdown').hidden=true;document.addEventListener('click',e=>{if(!e.target.closest('.dropdown')&&!e.target.closest('[data-menu]'))closeMenu()});
const modal=(html)=>{$('#modal').innerHTML=html;$('#modalShade').hidden=false};const closeModal=()=>$('#modalShade').hidden=true;$('#modalShade').onclick=e=>{if(e.target.id==='modalShade')closeModal()};
function newFile(name,value='{}'){let n=name,i=2;while(files.some(f=>f.name===n)){n=name.replace(/\.json$/,`-${i++}.json`)}files.push({name:n,value,dirty:true});active=n;renderFiles();status='outdated';renderStatus();renderDocument()}
function uploadTemplate(){modal('<h2>Upload template</h2><p class="muted">Mockup only: choose a sample filename to replace the template.</p><label>Filename <input id="templateName" value="new-template.docx" style="width:100%;padding:8px;border:1px solid #ddd"></label><div class="footer"><button id="cancelModal">Cancel</button><button class="primary" id="confirmTemplate">Upload</button></div>');$('#cancelModal').onclick=closeModal;$('#confirmTemplate').onclick=()=>{const n=$('#templateName').value.trim();if(!/\.(docx|xlsx)$/i.test(n))return alert('Use a DOCX or XLSX filename');if(!templates.includes(n))templates.push(n);template=n;status='outdated';renderStatus();renderTemplates();closeModal()}}
function showGenerateJson(){modal('<h2>Generate JSON</h2><p class="muted">Generate sample data from the template structure.</p><label>Items per collection</label><input type="number" id="itemCount" min="1" max="100" value="10"><label>Values</label><div><label><input type="radio" name="values" value="random" checked> Random values</label><label><input type="radio" name="values" value="empty"> Empty values</label></div><div class="footer"><button id="cancelModal">Cancel</button><button class="primary" id="confirmJson">Generate</button></div>');$('#cancelModal').onclick=closeModal;$('#confirmJson').onclick=()=>{const n=Math.max(1,Math.min(100,parseInt($('#itemCount').value)||1));const random=$('input[name=values]:checked').value==='random';const value=JSON.stringify({company:random?'Sample Company':'',customer:random?'Customer':'',total:random?12500:0,items:Array.from({length:n},(_,i)=>({name:random?`Item ${i+1}`:'',price:random?100*(i+1):0}))},null,2);newFile('generated.json',value);log('Generate JSON',true,'~40 ms');closeModal();renderDocument()}}

function clearLocal(){modal('<h2>Clear Local Data?</h2><p>This command would clear MonoReport-owned locally stored data and preferences. It would <b>not delete your original JSON or DOCX/XLSX files on disk</b>.</p><p class="muted">In this prototype, only the mockup session is reset. No browser storage is modified.</p><div class="footer"><button id="cancelModal">Cancel</button><button class="primary" id="confirmClear">Clear local data</button></div>');$('#cancelModal').onclick=closeModal;$('#confirmClear').onclick=()=>{files=[{name:'untitled.json',value:'{}',dirty:false}];active='untitled.json';template='';templates=[];logs=[];problem='';analysis=false;status='empty';renderFiles();renderTemplates();renderStatus();renderBottom();closeModal()}}
$$('[data-menu]').forEach(b=>b.addEventListener('click',()=>{const type=b.dataset.menu;if(type==='examples')menu([{heading:'DOCX EXAMPLES'},...['Sales Orders','Syntax Showcase','Project Costs'].map(n=>({label:n,action:()=>loadExample(n,'docx')})),{heading:'XLSX EXAMPLES'},...['Spreadsheet Basics','Formatting'].map(n=>({label:n,action:()=>loadExample(n,'xlsx')}))],b);else if(type==='analyze')menu([{label:'Generate JSON…',action:showGenerateJson}],b);else if(type==='main')menu([{label:'API documentation',action:()=>modal('<h2>API documentation</h2><p class="muted">The final implementation should reuse the existing API link from MonoReport.</p><div class="footer"><button id="closeApi">Close</button></div>')},{label:'Clear Local Data…',action:clearLocal}],b);else if(type==='data')menu([{label:'Open…',key:'⌘O',action:()=>newFile('untitled.json')},{label:'Save',key:'⌘S',action:()=>{if(current()){current().dirty=false;renderFiles()}}},{label:'Save As…',key:'⌘⇧S',action:()=>current()&&newFile('saved-as.json',current().value)},{label:'Format',key:'⇧⌥F',action:()=>{try{if(!current())return;current().value=JSON.stringify(JSON.parse(current().value),null,2);current().dirty=true;renderFiles()}catch(e){problem=e.message;openTab('problems')}}},{label:'Word wrap '+(wrap?'✓':''),key:'⌥Z',action:()=>{wrap=!wrap;renderFiles()}},{label:'Copy',key:'⌘C',action:()=>current()&&navigator.clipboard?.writeText(current().value)},{label:'Close',action:()=>{if(current()?.dirty&&!confirm('Close without saving changes?'))return;files=files.filter(f=>f.name!==active);active=files[0]?.name||'';renderFiles()}}],b);else menu([{label:'Upload…',action:uploadTemplate},{label:'Close',action:()=>{template='';status='outdated';renderTemplates();renderStatus()}},{label:'Hide panel',action:()=>{$('#workspace').classList.add('hidden-doc');$('#showDocument').hidden=false}}],b)}));
function loadExample(name,ext){const n='example.json';const value=JSON.stringify({company:name,customer:'Sample Customer',total:1999,items:[{name:'Sample item',price:1999}]},null,2);files=files.filter(f=>f.name!==n);files.push({name:n,value,dirty:false});active=n;template=`example.${ext}`;if(!templates.includes(template))templates.push(template);status='outdated';renderFiles();renderTemplates();renderStatus()}
$('#jsonSelect').onchange=e=>{if(current())current().value=$('#jsonEditor').value;active=e.target.value;renderFiles()};$('#templateSelect').onchange=e=>{template=e.target.value;status='outdated';renderTemplates();renderStatus()};$('#jsonEditor').oninput=e=>{current().value=e.target.value;current().dirty=true;$('#dataStatus').textContent='● Unsaved changes';status='outdated';renderStatus();renderDocument()};$('#viewTemplate').onclick=()=>{view='template';renderDocument()};$('#viewResult').onclick=()=>{view='result';renderDocument()};$('#generate').onclick=generate;$('#analyze').onclick=analyze;$('#hideDiagnostics').onclick=()=>$('#diagnostics').hidden=true;$$('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));$$('[data-open-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.openTab));$('#clearOutput').onclick=()=>{logs=[];renderBottom()};$('#reopenJson').onclick=()=>newFile('untitled.json');$('#showDocument').onclick=()=>{$('#workspace').classList.remove('hidden-doc');$('#showDocument').hidden=true};
let resizing=false;$('#resizer').onpointerdown=e=>{resizing=true;e.target.setPointerCapture(e.pointerId)};$('#resizer').onpointermove=e=>{if(!resizing||matchMedia('(max-width:720px)').matches)return;const rect=$('#workspace').getBoundingClientRect();const pct=Math.max(25,Math.min(75,((e.clientX-rect.left)/rect.width)*100));$('#dataPane').style.flex=`0 0 ${pct}%`;$('#documentPane').style.flex='1'};$('#resizer').onpointerup=()=>resizing=false;
renderFiles();renderTemplates();renderStatus();renderBottom();document.addEventListener('click',e=>{if(e.target?.id==='closeApi')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeModal()}});
})();
</script></body></html>
